<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Circular Crescent Arc -->
  <path d="M22 62 C20 85 40 104 64 104 C88 104 104 88 102 66 C98 84 82 98 62 98 C42 98 26 84 22 62 Z" fill="url(#goldGrad)" />

  <!-- Palm Tree Trunk & Fronds -->
  <!-- Trunk -->
  <path d="M58 58 L57 38 L63 38 L62 58 Z" fill="url(#goldGrad)" />
  <line x1="56" y1="42" x2="64" y2="42" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="56" y1="46" x2="64" y2="46" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="56" y1="50" x2="64" y2="50" stroke="url(#goldGrad)" stroke-width="1.5" />
  <line x1="57" y1="54" x2="63" y2="54" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Central Top Fronds -->
  <path d="M60 16 C60 26 60 36 60 38 C60 26 60 20 60 16 Z" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Fronds -->
  <path d="M60 34 C50 20 38 24 36 30 C44 28 52 30 58 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M60 36 C48 26 40 32 38 38 C46 36 54 37 58 38" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M60 38 C52 32 44 38 42 44 C48 41 54 41 58 40" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M60 40 C54 38 48 44 46 50 C50 46 56 44 58 42" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Right Fronds -->
  <path d="M60 34 C70 20 82 24 84 30 C76 28 68 30 62 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M60 36 C72 26 80 32 82 38 C74 36 66 37 62 38" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M60 38 C68 32 76 38 78 44 C72 41 66 41 62 40" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M60 40 C66 38 72 44 74 50 C70 46 64 44 62 42" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Crossed Curved Swords (Scimitars) -->
  <!-- Sword 1 (top-left to bottom-right curve) -->
  <path d="M30 76 C45 68 70 66 94 82 C82 72 58 68 32 82 Z" fill="url(#goldGrad)" />
  <!-- Pommel & Hilt 1 -->
  <circle cx="28" cy="84" r="2.5" fill="url(#goldGrad)" />
  <line x1="26" y1="80" x2="34" y2="86" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Sword 2 (top-right to bottom-left curve) -->
  <path d="M90 76 C75 68 50 66 26 82 C38 72 62 68 88 82 Z" fill="url(#goldGrad)" />
  <!-- Pommel & Hilt 2 -->
  <circle cx="92" cy="84" r="2.5" fill="url(#goldGrad)" />
  <line x1="94" y1="80" x2="86" y2="86" stroke="url(#goldGrad)" stroke-width="2" />
</svg>
