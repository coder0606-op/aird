<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Globe Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034870" />
    </linearGradient>
    <!-- Plane Gradient -->
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Left: Globe with Orbit & Airplane -->
  <g transform="translate(8, 6)">
    <!-- Globe Base -->
    <circle cx="34" cy="34" r="28" fill="none" stroke="#0284c7" stroke-width="2.2" opacity="0.9" />
    
    <!-- Globe Meridians & Parallels -->
    <ellipse cx="34" cy="34" rx="14" ry="28" fill="none" stroke="#0284c7" stroke-width="1.6" opacity="0.75" />
    <line x1="6" y1="34" x2="62" y2="34" stroke="#0284c7" stroke-width="1.6" opacity="0.75" />
    <path d="M12 20 Q34 26 56 20" fill="none" stroke="#0284c7" stroke-width="1.4" opacity="0.65" />
    <path d="M12 48 Q34 42 56 48" fill="none" stroke="#0284c7" stroke-width="1.4" opacity="0.65" />
    <line x1="34" y1="6" x2="34" y2="62" stroke="#0284c7" stroke-width="1.6" opacity="0.75" />

    <!-- Stylized 'B' in Globe Center -->
    <text x="32" y="44" font-family="'Poppins', sans-serif" font-weight="900" font-size="28" fill="#ffffff" stroke="#034870" stroke-width="1.5" text-anchor="middle">B</text>

    <!-- Orbit Trail -->
    <path d="M14 52 C6 28 36 8 58 16" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,2.5" />

    <!-- Airplane Flying on Orbit -->
    <g transform="translate(56, 14) rotate(42) scale(0.85)">
      <path d="M0 -12 L4 0 L14 4 L4 5 L3 11 L0 9 L-3 11 L-4 5 L-14 4 L-4 0 Z" fill="#0284c7" />
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(82, 0)">
    <!-- BORDERLINK -->
    <text x="0" y="42" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="27" fill="#034870" letter-spacing="1">BORDERLINK</text>
    
    <!-- Little Jet Accent above R/D -->
    <g transform="translate(108, 18) rotate(35) scale(0.55)">
      <path d="M0 -10 L3 0 L10 3 L3 4 L2 8 L0 7 L-2 8 L-3 4 L-10 3 L-3 0 Z" fill="#0284c7" />
    </g>

    <!-- TRAVEL & TOURS (PVT.) LTD -->
    <text x="1" y="58" font-family="'Poppins', sans-serif" font-weight="700" font-size="9.5" fill="#1e293b" letter-spacing="1.8">TRAVEL &amp; TOURS (PVT.) LTD</text>
  </g>
</svg>
