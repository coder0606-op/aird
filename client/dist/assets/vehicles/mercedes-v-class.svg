<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bodyGradVan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="glassGradVan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>
    <filter id="carShadowVan" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="182" rx="165" ry="11" fill="#64748B" opacity="0.28" filter="blur(4px)" />

  <!-- Main Van Group -->
  <g filter="url(#carShadowVan)">
    <!-- High VIP Roof -->
    <path d="M125 46 L340 46" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Upper Cabin -->
    <path d="M80 92 L120 48 L348 48 L355 92 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Large Executive Tinted Windows -->
    <path d="M86 90 L124 52 L175 52 L175 90 Z" fill="url(#glassGradVan)" />
    <path d="M181 52 L238 52 L238 90 L181 90 Z" fill="url(#glassGradVan)" />
    <path d="M244 52 L298 52 L298 90 L244 90 Z" fill="url(#glassGradVan)" />
    <path d="M304 52 L344 52 L350 90 L304 90 Z" fill="url(#glassGradVan)" />

    <!-- Window Pillars -->
    <line x1="178" y1="50" x2="178" y2="92" stroke="#FFFFFF" stroke-width="4" />
    <line x1="241" y1="50" x2="241" y2="92" stroke="#FFFFFF" stroke-width="4" />
    <line x1="301" y1="50" x2="301" y2="92" stroke="#FFFFFF" stroke-width="4" />

    <!-- Lower Body Exterior (Mercedes V-Class Luxury Chauffeur) -->
    <path d="M48 124 L68 94 L85 92 L120 48 L350 48 L364 85 L364 146 L348 148 L330 148 C330 120 282 120 282 148 L142 148 C142 120 94 120 94 148 L54 148 L48 136 Z" 
          fill="url(#bodyGradVan)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Clean Executive Waistline Accent -->
    <path d="M72 98 L360 98" stroke="#94A3B8" stroke-width="1.2" opacity="0.6" />
    <path d="M64 116 L362 116" stroke="#FFFFFF" stroke-width="2" />
    <path d="M64 118 L362 118" stroke="#94A3B8" stroke-width="1" opacity="0.4" />

    <!-- VIP Mercedes Chrome Grille & Headlights -->
    <path d="M48 114 L74 114 L71 135 L48 132 Z" fill="#E2E8F0" />
    <polygon points="49,114 72,114 69,126 50,124" fill="#38BDF8" opacity="0.85" />
    <line x1="53" y1="120" x2="69" y2="120" stroke="#FFFFFF" stroke-width="2" />
    <path d="M51 114 L71 114 L71 118" fill="none" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Mercedes Vertical Taillight -->
    <polygon points="362,96 352,98 352,128 362,126" fill="#EF4444" />
    <polygon points="362,106 354,108 354,118 362,116" fill="#FFFFFF" opacity="0.8" />

    <!-- Large Sliding Passenger Door Lines -->
    <line x1="175" y1="92" x2="175" y2="148" stroke="#94A3B8" stroke-width="1.2" />
    <line x1="295" y1="92" x2="295" y2="148" stroke="#94A3B8" stroke-width="1.2" />
    <rect x="150" y="104" width="16" height="4" rx="2" fill="#475569" />
    <rect x="270" y="104" width="16" height="4" rx="2" fill="#475569" />

    <!-- Side Mirror -->
    <path d="M110 84 C110 79 120 79 123 83 L123 92 L114 92 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />

    <!-- Wheel Arches -->
    <path d="M86 148 C86 116 150 116 150 148" fill="none" stroke="#1E293B" stroke-width="4" />
    <path d="M274 148 C274 116 338 116 338 148" fill="none" stroke="#1E293B" stroke-width="4" />

    <!-- Side Step -->
    <rect x="146" y="146" width="130" height="6" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="1" />
  </g>

  <!-- Front Wheel -->
  <g>
    <circle cx="118" cy="148" r="26" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <circle cx="118" cy="148" r="16" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="118" cy="148" r="6" fill="#475569" />
    <line x1="118" y1="132" x2="118" y2="164" stroke="#64748B" stroke-width="2.5" />
    <line x1="104" y1="140" x2="132" y2="156" stroke="#64748B" stroke-width="2.5" />
    <line x1="104" y1="156" x2="132" y2="140" stroke="#64748B" stroke-width="2.5" />
    <circle cx="118" cy="148" r="3" fill="#00A6B2" />
  </g>

  <!-- Rear Wheel -->
  <g>
    <circle cx="306" cy="148" r="26" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
    <circle cx="306" cy="148" r="16" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="306" cy="148" r="6" fill="#475569" />
    <line x1="306" y1="132" x2="306" y2="164" stroke="#64748B" stroke-width="2.5" />
    <line x1="292" y1="140" x2="320" y2="156" stroke="#64748B" stroke-width="2.5" />
    <line x1="292" y1="156" x2="320" y2="140" stroke="#64748B" stroke-width="2.5" />
    <circle cx="306" cy="148" r="3" fill="#00A6B2" />
  </g>
</svg>
